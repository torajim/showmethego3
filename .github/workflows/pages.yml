name: pages

# torajim.github.io/showmethego3/ 프로젝트 사이트로 배포한다.
# 사전 설정: 저장소 Settings → Pages → Source를 "GitHub Actions"로 지정.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call: # news.yml이 뉴스 갱신 후 호출

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # 뉴스 커밋 직후 호출될 때도 최신 main을 빌드
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
