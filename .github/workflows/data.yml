name: data

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate admissions data
        run: python scripts/admissions.py validate
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Generated files are up to date
        run: |
          python scripts/admissions.py build
          git diff --exit-code data/generated
